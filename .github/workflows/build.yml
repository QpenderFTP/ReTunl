# Installers for Windows (NSIS .exe) and macOS (.dmg, Apple Silicon + Intel),
# APKs for Android (arm64 and armv7 phones).
# Run it by hand (Actions → Build → Run workflow) or push a tag like v0.1.0:
# a tag also publishes a release with all of them attached.
#
# The APKs are signed with the release key from the repository secrets
# ANDROID_KEYSTORE_B64 (the .jks file in base64), ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD.
#
# A tag build sees only the caches of its own tag and of main. So a push to main
# that changes the Android build (this file, the libbox scripts, the Gradle
# wrapper) runs the android job alone, and its caches serve every later tag.
# Run the workflow by hand on main to refresh the Windows and macOS caches too.

name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    # not checked for tags: every tag builds
    paths:
      - .github/workflows/build.yml
      - tools/build-libbox.sh
      - tools/prepare-libbox.sh
      - crates/app/gen/android/gradle/wrapper/gradle-wrapper.properties

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SING_BOX_VERSION: 1.14.4
  SING_BOX_LX_VERSION: 1.14.4-lx.32

jobs:
  windows:
    # a push to main only warms the Android caches
    if: github.event_name != 'push' || github.ref_type == 'tag'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: sing-box for the tests
        run: |
          get() { # url sha256 folder
            curl -fsSL "$1" -o core.zip
            echo "$2  core.zip" | sha256sum -c -
            mkdir -p "$3" && unzip -q -o core.zip -d "$3" && rm core.zip
          }
          get "https://github.com/SagerNet/sing-box/releases/download/v$SING_BOX_VERSION/sing-box-$SING_BOX_VERSION-windows-amd64.zip" \
            99185d75d314a07dbba4a130c8ad986cbeb629a07927975636b341ca61f991df .tools/sing-box
          get "https://github.com/Leadaxe/sing-box-lx/releases/download/v$SING_BOX_LX_VERSION/sing-box-$SING_BOX_LX_VERSION-windows-amd64.zip" \
            5eff0f5fba576d3eb57b7ce9c6b60a90125d0a716138ffcd7db47e04e3db2e1a .tools/sing-box-lx

      - name: Tests
        env:
          RETUNL_NO_SYSTEM_PROXY: "1"
        run: cargo test --workspace

      - name: Installer
        working-directory: crates/app
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: ReTunl-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    if: github.event_name != 'push' || github.ref_type == 'tag'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: sing-box for the tests
        run: |
          get() { # url sha256 folder
            curl -fsSL "$1" -o core.tar.gz
            echo "$2  core.tar.gz" | shasum -a 256 -c -
            mkdir -p "$3" && tar -xzf core.tar.gz -C "$3" && rm core.tar.gz
          }
          get "https://github.com/SagerNet/sing-box/releases/download/v$SING_BOX_VERSION/sing-box-$SING_BOX_VERSION-darwin-arm64.tar.gz" \
            0d8c7f5ed5d587b0f1a5e9772a708ec3bfa4ac4c9329604b01d8d9c2ba406838 .tools/sing-box
          get "https://github.com/Leadaxe/sing-box-lx/releases/download/v$SING_BOX_LX_VERSION/sing-box-$SING_BOX_LX_VERSION-darwin-arm64.tar.gz" \
            c4f4eddab7513e970f614766ea03c028de88ef5477f8dea629c9e63c2fb7c2b5 .tools/sing-box-lx
          # the folder inside each archive differs; find the binary itself
          bin() { f=$(find "$PWD/$1" -type f -name sing-box | head -n 1); test -n "$f" && chmod +x "$f" && echo "$f"; }
          sb=$(bin .tools/sing-box)
          lx=$(bin .tools/sing-box-lx)
          echo "SING_BOX=$sb" >> "$GITHUB_ENV"
          echo "SING_BOX_LX=$lx" >> "$GITHUB_ENV"

      - name: Tests
        env:
          RETUNL_NO_SYSTEM_PROXY: "1"
        run: cargo test --workspace

      # one .dmg for both Apple Silicon and Intel Macs, signed ad hoc (no Apple Developer ID)
      - name: Installer
        working-directory: crates/app
        run: npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ReTunl-macos
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 29.0.14206865
      ANDROID_PLATFORM: android-37.0
      TAURI_CLI_VERSION: 2.12.4
    steps:
      - uses: actions/checkout@v4

      # the NDK, Rust for two phone architectures and the Go build of the core need room
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules/@angular /opt/ghc /usr/local/.ghcup /usr/local/share/boost

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2

      # Gradle calls the CLI back as `cargo tauri` while it builds the APK
      # (gen/android/buildSrc/.../BuildTask.kt), so here it is the cargo one, not npx
      - name: Tauri CLI
        run: curl -sSfL "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v$TAURI_CLI_VERSION/cargo-tauri-x86_64-unknown-linux-gnu.tgz" | tar xz -C "$HOME/.cargo/bin" cargo-tauri

      - name: Android NDK and platform
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses > /dev/null || true
          "$sdk" --install "ndk;$NDK_VERSION" "platforms;$ANDROID_PLATFORM" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # libbox (sing-box-lx with the Clash API) takes long to build: it is kept
      # between runs and built again only when tools/build-libbox.sh changes
      - uses: actions/cache/restore@v4
        id: libbox
        with:
          path: .tools/libbox-*-retunl.aar
          key: libbox-arm-${{ hashFiles('tools/build-libbox.sh') }}
      - uses: actions/setup-go@v5
        if: steps.libbox.outputs.cache-hit != 'true'
        with:
          go-version: "1.26.10"
          cache: false
      - name: libbox
        env:
          LIBBOX_TARGETS: android/arm64,android/arm
          LIBBOX_ABIS: arm64-v8a armeabi-v7a
        run: bash tools/prepare-libbox.sh
      # saved straight away: a failure in a later step should not cost another core build
      - uses: actions/cache/save@v4
        if: steps.libbox.outputs.cache-hit != 'true'
        with:
          path: .tools/libbox-*-retunl.aar
          key: ${{ steps.libbox.outputs.cache-primary-key }}

      # services.gradle.org sometimes stalls: Gradle is kept between runs and,
      # when missing, fetched here with retries before the APK build needs it
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ hashFiles('crates/app/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Gradle
        working-directory: crates/app/gen/android
        run: |
          for i in 1 2 3; do
            ./gradlew --version > /dev/null && exit 0
            echo "::warning::Gradle download failed (attempt $i)"
            sleep 20
          done
          exit 1

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::The ANDROID_KEYSTORE_B64 secret is missing: without the key the APK cannot be installed (README, «Сборка» → «Android»)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/retunl.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/retunl.jks" >> "$GITHUB_ENV"

      - name: APK
        working-directory: crates/app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cargo tauri android build --apk --split-per-abi --target aarch64 --target armv7

      - name: Name the APKs
        run: |
          v=$(grep -m1 '"version"' crates/app/tauri.conf.json | cut -d'"' -f4)
          out=crates/app/gen/android/app/build/outputs/apk
          ls -R "$out"
          mkdir -p dist
          # a name ending in -unsigned.apk means the key did not apply: then this fails
          cp "$out/arm64/release/app-arm64-release.apk" "dist/ReTunl_${v}_arm64.apk"
          cp "$out/arm/release/app-arm-release.apk" "dist/ReTunl_${v}_armv7.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ReTunl-android
          path: dist/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: dist/*
