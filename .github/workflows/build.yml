# Installers for Windows (NSIS .exe) and macOS (.dmg, Apple Silicon + Intel).
# Run it by hand (Actions → Build → Run workflow) or push a tag like v0.1.0:
# a tag also creates a draft release with both installers attached.

name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SING_BOX_VERSION: 1.14.4
  SING_BOX_LX_VERSION: 1.14.4-lx.32

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: sing-box for the tests
        run: |
          get() { # url sha256 folder
            curl -fsSL "$1" -o core.zip
            echo "$2  core.zip" | sha256sum -c -
            mkdir -p "$3" && unzip -q -o core.zip -d "$3" && rm core.zip
          }
          get "https://github.com/SagerNet/sing-box/releases/download/v$SING_BOX_VERSION/sing-box-$SING_BOX_VERSION-windows-amd64.zip" \
            99185d75d314a07dbba4a130c8ad986cbeb629a07927975636b341ca61f991df .tools/sing-box
          get "https://github.com/Leadaxe/sing-box-lx/releases/download/v$SING_BOX_LX_VERSION/sing-box-$SING_BOX_LX_VERSION-windows-amd64.zip" \
            5eff0f5fba576d3eb57b7ce9c6b60a90125d0a716138ffcd7db47e04e3db2e1a .tools/sing-box-lx

      - name: Tests
        env:
          RETUNL_NO_SYSTEM_PROXY: "1"
        run: cargo test --workspace

      - name: Installer
        working-directory: crates/app
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: ReTunl-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: sing-box for the tests
        run: |
          get() { # url sha256 folder
            curl -fsSL "$1" -o core.tar.gz
            echo "$2  core.tar.gz" | shasum -a 256 -c -
            mkdir -p "$3" && tar -xzf core.tar.gz -C "$3" && rm core.tar.gz
          }
          get "https://github.com/SagerNet/sing-box/releases/download/v$SING_BOX_VERSION/sing-box-$SING_BOX_VERSION-darwin-arm64.tar.gz" \
            0d8c7f5ed5d587b0f1a5e9772a708ec3bfa4ac4c9329604b01d8d9c2ba406838 .tools/sing-box
          get "https://github.com/Leadaxe/sing-box-lx/releases/download/v$SING_BOX_LX_VERSION/sing-box-$SING_BOX_LX_VERSION-darwin-arm64.tar.gz" \
            c4f4eddab7513e970f614766ea03c028de88ef5477f8dea629c9e63c2fb7c2b5 .tools/sing-box-lx
          echo "SING_BOX=$PWD/.tools/sing-box/sing-box-$SING_BOX_VERSION-darwin-arm64/sing-box" >> "$GITHUB_ENV"
          echo "SING_BOX_LX=$PWD/.tools/sing-box-lx/sing-box-$SING_BOX_LX_VERSION-darwin-arm64/sing-box" >> "$GITHUB_ENV"

      - name: Tests
        env:
          RETUNL_NO_SYSTEM_PROXY: "1"
        run: cargo test --workspace

      # one .dmg for both Apple Silicon and Intel Macs, signed ad hoc (no Apple Developer ID)
      - name: Installer
        working-directory: crates/app
        run: npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ReTunl-macos
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
