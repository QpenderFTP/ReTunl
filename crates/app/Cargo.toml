[package]
name = "retunl"
description = "Split tunneling for WireGuard, VLESS, Hysteria and other VPN protocols"
version.workspace = true
edition.workspace = true
license.workspace = true

# The app is a library: the desktop binary (main.rs) and Android load it.
[lib]
name = "retunl_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
retunl-core = { path = "../core" }
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
base64.workspace = true
percent-encoding.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
dirs = "6"
png = "0.17"
# managing your own servers over SSH
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
curve25519-dalek = "5"
rand_core = { version = "0.6", features = ["getrandom"] }
qrcode = { version = "0.14", default-features = false }
flate2 = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }

# Android: sing-box runs in the app (crates/vpn-android); files come as content:// links
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-retunl-vpn = { path = "../vpn-android" }
tauri-plugin-fs = "2"
tauri-plugin-barcode-scanner = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
chacha20poly1305 = "0.10"
tar = { version = "0.4", default-features = false }

[target.'cfg(windows)'.dependencies]
ipconfig = "0.3"
winreg = "0.55"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinInet",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
