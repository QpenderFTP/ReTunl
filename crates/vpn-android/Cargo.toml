[package]
name = "tauri-plugin-retunl-vpn"
description = "The Android VPN service of ReTunl: runs sing-box (libbox) inside VpnService"
version.workspace = true
edition.workspace = true
license.workspace = true
links = "tauri-plugin-retunl-vpn"

[dependencies]
