[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.2.7"
edition = "2021"
license = "MIT"
authors = ["ReTunl contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"

# Argon2 (export password) is unbearably slow unoptimised
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
